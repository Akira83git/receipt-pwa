<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="レシート色分け">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>レシート色分け</title>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">RECEIPT SPLITTER</p>
      <h1>レシート色分け</h1>
      <p>撮影して、色を選び、品目をタップ。</p>
    </header>

    <section class="card capture-card">
      <label id="photo-label" class="photo-button" for="receipt-input">レシートを撮影・選択</label>
      <input id="receipt-input" type="file" accept="image/*">
      <img id="preview" alt="選択したレシート" hidden>
      <button id="scan-button" class="primary" type="button" disabled>文字を読み取る</button>
      <div id="progress-wrap" hidden>
        <progress id="progress" max="1" value="0"></progress>
        <p id="status" aria-live="polite">準備中…</p>
      </div>
    </section>

    <section id="assignment" class="card" hidden>
      <h2 class="sr-only">色を選ぶ</h2>
      <div id="colors" class="colors" aria-label="色グループ"></div>
      <h2>レシートごとに品目を選ぶ</h2>
      <p class="hint">品目を押して色分け。商品名と金額は修正できます。</p>
      <div id="receipts" class="receipts"></div>
      <div id="overall-summary" class="overall-summary" hidden>
        <h2>すべてのレシートの合計</h2>
        <div id="overall-totals"></div>
      </div>
      <label class="photo-button add-receipt" for="receipt-input">＋ レシートを追加</label>
    </section>
  </main>

  <div id="wheel-modal" class="wheel-modal" hidden>
    <button id="wheel-backdrop" class="wheel-backdrop" type="button" aria-label="閉じる"></button>
    <section class="wheel-sheet" role="dialog" aria-modal="true" aria-labelledby="wheel-title">
      <div class="wheel-header">
        <button id="wheel-cancel" class="wheel-action" type="button">取消</button>
        <h2 id="wheel-title">金額を修正</h2>
        <button id="wheel-done" class="wheel-action done" type="button">決定</button>
      </div>
      <div class="wheel-value" aria-live="polite">$<span id="wheel-value">0.00</span></div>
      <div class="wheel-picker">
        <div class="selection-bar"></div>
        <div id="integer-wheel" class="wheel" aria-label="整数"></div>
        <span class="decimal-point">.</span>
        <div id="decimal-wheel" class="wheel" aria-label="小数"></div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
