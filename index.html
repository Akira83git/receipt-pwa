<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="レシート色分け">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>レシート色分け</title>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">RECEIPT SPLITTER</p>
      <h1>レシート色分け</h1>
      <p>撮影して、色を選び、品目をタップ。</p>
    </header>

    <section class="card capture-card">
      <label class="photo-button" for="receipt-input">レシートを撮影・選択</label>
      <input id="receipt-input" type="file" accept="image/*" capture="environment">
      <img id="preview" alt="選択したレシート" hidden>
      <button id="scan-button" class="primary" type="button" disabled>文字を読み取る</button>
      <div id="progress-wrap" hidden>
        <progress id="progress" max="1" value="0"></progress>
        <p id="status" aria-live="polite">準備中…</p>
      </div>
    </section>

    <section id="assignment" class="card" hidden>
      <h2>1. 色を選ぶ</h2>
      <div id="colors" class="colors" aria-label="色グループ"></div>
      <h2>2. 品目を選ぶ</h2>
      <p class="hint">品目を押して色分け。金額欄は直接修正できます。</p>
      <div id="items" class="items"></div>
      <div class="live-summary">
        <h2>現在の合計</h2>
        <div id="live-totals"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
